name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 本地完整回归要求固定 Rust 1.100.0 工具链（见 operatelog SC-20261115-001/015）
  RUSTUP_TOOLCHAIN: '1.100.0'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build:scene

  mac-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - run: npm ci
      - run: npm test
      - run: npm run build:mac:check
