name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 本地完整回归要求固定 Rust 1.100.0 工具链（见 operatelog SC-20261115-001/015）
  RUSTUP_TOOLCHAIN: '1.100.0'

jobs:
  test:
    # 产品为 macOS 助理，npm test 含 launchctl/系统域等 macOS 专用用例，ubuntu 从未能通过
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          if [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            mkdir -p "$HOME/.cargo/bin"
            ln -s "$(command -v rustup)" "$HOME/.cargo/bin/cargo"
          fi
          "$HOME/.cargo/bin/cargo" --version
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run build:hud
      - run: npm test
      - run: npm run build:scene

  mac-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          if [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            mkdir -p "$HOME/.cargo/bin"
            ln -s "$(command -v rustup)" "$HOME/.cargo/bin/cargo"
          fi
          "$HOME/.cargo/bin/cargo" --version
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run build:hud
      - run: npm test
      - run: npm run build:mac:check
