[package]
name = "moss-desktop-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.12.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "=2.4.1"

# macOS transparent WKWebView requires macos-private-api above.
# This isolated probe is NOT an App Store distribution build.
