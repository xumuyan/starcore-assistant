<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>贾维斯 · 动态桌面</title><link rel="stylesheet" href="study.css"></head><body>
<canvas id="scene" aria-label="按原设计图投影的分层三维场景"></canvas><div class="reference-view" aria-hidden="true"></div><button id="reference-exit" class="reference-exit">返回动态页面 · Esc</button>
<div class="hud"><header><div class="identity"><img src="jarvis-mark-v6.png" alt=""><div><h1 id="assistant-name">贾维斯</h1><span>JARVIS / PERSONAL INTELLIGENCE</span></div></div><div class="top-right"><time id="clock">14:48</time><i class="divider"></i><button id="settings-open" class="icon-button" aria-label="设置"><img src="icons/gear-six.svg" alt=""></button><span class="connection"><img src="icons/cloud.svg" alt="">本机识别 · 云桥对话</span></div></header>
<main class="live-content" aria-live="polite"><div class="speaker"><span></span><b id="speaker-name">贾维斯</b><span></span></div><p id="focus-content">我在。 接下来，我们先解决哪个问题？</p><p id="core-detail">说「<span class="wake-name">贾维斯</span>」继续对话</p></main>
<section class="task-glance"><img src="icons/article.svg" alt=""><div><span>当前项目</span><p>Mac 个人助理</p><button id="project-open">等待你的下一步 <img src="icons/caret-right.svg" alt=""></button></div></section>
<section class="recent-glance"><button id="history-open"><img src="icons/clock.svg" alt="">最近对话</button><button class="recent-item" data-prompt="帮我整理今天的会议要点">帮我整理今天的会议要点<img src="icons/caret-right.svg" alt=""></button><button class="recent-item" data-prompt="分析这份产品方案的优缺点">分析这份产品方案的优缺点</button></section>
<section class="controls"><div class="control-strip"><button id="listen" class="listen-button" aria-label="演示聆听状态" aria-pressed="true"><span class="mic-symbol"><img src="icons/microphone.svg" alt=""></span><span id="listen-label">聆听中</span></button><div class="wave" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div><button id="interrupt" class="strip-button">打断</button><button id="keyboard-toggle" class="strip-button keyboard" aria-label="文字输入"><img src="icons/keyboard.svg" alt=""></button></div><p class="wake-hint">输入问题，或按下空格键说话…</p></section></div>
<section id="composer-panel" class="composer" hidden><div><span>文字预览</span><button id="keyboard-close" aria-label="关闭文字输入">关闭</button></div><textarea id="input" aria-label="消息内容" placeholder="输入问题…"></textarea><button id="send">预览这句话</button></section>
<section id="settings-panel" class="settings-panel" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title"><div class="panel-heading"><h2 id="settings-title">场景设置</h2><button id="settings-close" aria-label="关闭设置">关闭</button></div><p class="preview-note">独立视觉预览。聆听按钮仅演示状态，不采集语音、不连接聊天服务。画面采用原图分层投影与三维网格运动。</p><div class="identity-settings"><label>助理名字<input id="set-name" value="贾维斯" maxlength="30"></label><label>唤醒词<input id="set-wake" value="贾维斯" maxlength="20"></label></div><section class="toolbar" aria-label="动态样片控制"><button id="pause">暂停运动</button><label>速度<select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><label><input id="rings" type="checkbox" checked>机械环</label><label><input id="plasma" type="checkbox" checked>核心</label><label><input id="floor" type="checkbox" checked>底盘</label><label><input id="planets" type="checkbox" checked>星球</label><label><input id="compare" type="checkbox">对照设计图</label><label><input id="wireframe" type="checkbox">结构线框</label><button id="run-check">检查固定镜头</button><button id="record">录制十秒</button></section><p id="camera-label">正在加载场景</p><p id="status">固定镜头 · 各层独立运动</p><span id="qa-label"></span><output id="qa-result" hidden></output><details><summary>查看真实运动数据</summary><output id="diagnostics"></output></details></section><div id="toast" role="status" hidden></div><script type="module" src="study.js"></script></body></html>
