[package]
name = "moss-host"
version = "0.1.0"
edition = "2021"
description = "MOSS 宿主引擎（Rust 阶段一）：与 node 版逐字段对齐的只读状态命令"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
ureq = { version = "2", default-features = false, features = ["tls", "json", "gzip"] }
regex = "1"
